# Set custom control key
set -sg prefix C-a
bind C-a send-prefix
unbind C-b

# Reduce escape-key delay
set -sg escape-time 10

# Enable mouse functionality
set-option -sg mouse on

# Enable truecolor support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'

# Theming - palette: see ../../THEME.md
set -g status-style "bg=#2b3045,fg=#ffffff"
set -g window-status-current-style "bg=#2fafff,fg=#0d0e1c"
set -g pane-border-style "fg=#61647a"
set -g pane-active-border-style "fg=#2fafff"
set -g message-style "bg=#d0bc00,fg=#0d0e1c"
